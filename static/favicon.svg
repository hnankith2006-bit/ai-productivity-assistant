# Ankith | AI Builder & Product Engineer

This project is a personal portfolio and AI productivity landing page designed to be deployed as a public website for `ankith.com`.

## Features
- Modern portfolio homepage
- AI assistant demo integration
- FastAPI backend for product demos and API responses
- Deployment-ready structure for Render and Docker

## Run locally

```bash
python -m venv .venv
source .venv/bin/activate  # Windows: .venv\Scripts\activate
pip install -r requirements.txt
uvicorn app.main:app --reload
```

Then open:

```text
http://localhost:8000
```

## Deploy to Render

1. Push this repo to GitHub.
2. Import the repo into Render.
3. Use the included `render.yaml` or create a web service.
4. Set environment variables if using OpenAI:
   - `OPENAI_API_KEY`
   - `OPENAI_MODEL=gpt-4o-mini`
5. Add your custom domain: `ankith.com`
6. Update DNS records as shown by Render and enable SSL.

## Domain launch checklist for ankith.com

- Buy the domain from a registrar such as Namecheap, Cloudflare, or GoDaddy
- Point DNS to your hosting provider
- Add the custom domain in the deploy platform dashboard
- Configure SSL certificate
- Test the live site and verify redirects

## Files
- `app/main.py` — FastAPI backend and AI chat endpoint
- `static/index.html` — Personal landing page
- `render.yaml` — Render deployment configuration
- `Dockerfile` — Docker deployment template

